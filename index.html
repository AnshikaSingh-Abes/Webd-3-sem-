<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>2nd Year</h2>
        <form>
            <div class="input-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" placeholder="Enter your first name" required>
            </div>

            <div class="input-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" placeholder="Enter your last name" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <!-- Contact Number -->
            <div class="input-group">
                <label for="contact">Contact No</label>
                <input type="tel" id="contact" placeholder="Enter your contact number" required>
            </div>

            <!-- Gender (Radio Buttons) -->
            <div class="radio-checkbox-group">
                <label class="group-title">Gender:</label>
                <label class="item-label">
                    <input type="radio" name="gender" value="male" required> Male
                </label>
                <label class="item-label">
                    <input type="radio" name="gender" value="female"> Female
                </label>
            </div>

            <!-- Course (Checkboxes) -->
            <div class="radio-checkbox-group">
                <label class="group-title">Course:</label>
                <label class="item-label">
                    <input type="checkbox" name="course" value="btech"> B.Tech
                </label>
                <label class="item-label">
                    <input type="checkbox" name="course" value="bca"> BCA
                </label>
                <label class="item-label">
                    <input type="checkbox" name="course" value="msc"> M.Sc (Comp Science)
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Register</button>
        </form>
    </div>

</body>
</html>
